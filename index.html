<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Calorias</title>
  <meta name="description" content="Registro pessoal de calorias e macros">
  <meta name="theme-color" content="#0a110d">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // aplica o tema antes de pintar (evita piscar)
    try { const t = localStorage.getItem('tema'); if (t === 'claro' || t === 'escuro') document.documentElement.dataset.tema = t; } catch {}
    // cores personalizadas (Ajustes › Aparência), também antes de pintar
    try { const c = localStorage.getItem('coresCss'); if (c) document.write('<style id="cores-usuario">' + c + '</style>'); } catch {}
    try { const e = localStorage.getItem('escalaFonte'); if (e) document.documentElement.style.setProperty('--escala-fonte', e); } catch {}
  </script>
</head>
<body>
  <header class="topo" id="topo"></header>
  <main id="tela" class="tela" tabindex="-1"></main>

  <nav class="nav" aria-label="Navegação principal">
    <a href="#diario" data-rota="diario"><span class="pilula"><svg class="i" aria-hidden="true"><use href="icons/sprite.svg#notebook-text"/></svg></span><span>Diário</span></a>
    <a href="#registros" data-rota="registros"><span class="pilula"><svg class="i" aria-hidden="true"><use href="icons/sprite.svg#scale"/></svg></span><span>Registros</span></a>
    <a href="#adicionar" data-rota="adicionar" class="fab" aria-label="Adicionar alimento"><span class="pilula"><svg class="i" aria-hidden="true"><use href="icons/sprite.svg#plus"/></svg></span><span>Adicionar</span></a>
    <a href="#progresso" data-rota="progresso"><span class="pilula"><svg class="i" aria-hidden="true"><use href="icons/sprite.svg#chart-line"/></svg></span><span>Progresso</span></a>
    <a href="#config" data-rota="config"><span class="pilula"><svg class="i" aria-hidden="true"><use href="icons/sprite.svg#settings"/></svg></span><span>Ajustes</span></a>
  </nav>

  <div id="folha" class="folha" hidden role="dialog" aria-modal="true"></div>
  <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

  <noscript>Este app precisa de JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
